name: Echofang Android build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  verify-and-export:
    name: Test and export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Godot 4.3 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK and Java paths for Godot
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          JAVA="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")}" 
          mkdir -p "$HOME/.config/godot"
          echo "Godot Android SDK: $SDK"
          echo "Godot Java SDK: $JAVA"
          test -d "$SDK"
          test -d "$JAVA"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          EOF
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"
          echo "GODOT_ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA" >> "$GITHUB_ENV"

      - name: Verify Godot version and project import
        shell: bash
        run: godot --version && godot --headless --path . --editor --quit --verbose

      - name: Parse gameplay scripts
        shell: bash
        run: godot --headless --path . --script res://tests/parse_scripts.gd

      - name: Run deterministic GDScript suite first
        id: tests
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee test-output.log

      - name: Surface Godot test output as annotations
        if: failure() && steps.tests.conclusion == 'failure'
        shell: bash
        run: |
          # GitHub's job log service is occasionally unavailable; annotations keep the exact
          # headless error visible through the Checks API as well as the uploaded artifact.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Godot test::$line"
          done < test-output.log
          exit 1

      - name: Launch main scene headlessly
        shell: bash
        run: |
          set -o pipefail
          timeout 30s godot --headless --display-driver headless --path . --script res://tests/boot_scene.gd --verbose 2>&1 | tee app-smoke.log
          test ${PIPESTATUS[0]} -eq 0
          ! grep -q "^ERROR:" app-smoke.log

      - name: Surface main scene smoke output
        if: failure()
        shell: bash
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Main scene smoke::$line"
          done < app-smoke.log
          exit 1

      - name: Export signed debug APK
        id: export
        shell: bash
        env:
          # A protected release keystore can replace Godot's debug signer later.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/echofang-release.keystore
            export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/echofang-release.keystore
          fi
          # Godot's 4.3 headless validator rejects an empty debug-key triplet even for a
          # debug export. Export unsigned, then generate a throwaway CI debug keystore and
          # sign with the Android SDK's apksigner. No key material is committed.
          keytool -genkeypair -noprompt -keystore /tmp/echofang-debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          set -o pipefail
          godot --headless --path . --export-debug "Android" build/Echofang-unsigned.apk 2>&1 | tee export-output.log
          test -s build/Echofang-unsigned.apk
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$ANDROID_SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks /tmp/echofang-debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out build/Echofang.apk build/Echofang-unsigned.apk
          "$APKSIGNER" verify --verbose build/Echofang.apk
          test -s build/Echofang.apk

      - name: Surface Android export output as annotations
        if: failure() && steps.export.conclusion == 'failure'
        shell: bash
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Android export::$line"
          done < export-output.log
          {
            echo '### Godot Android export output'
            echo '```text'
            cat export-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: echofang-android-debug
          path: build/Echofang.apk
          if-no-files-found: error

      - name: Upload Godot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echofang-failure-logs
          path: |
            test-output.log
            app-smoke.log
            export-output.log
            ~/.local/share/godot/app_userdata/**/*.log
            .godot/**/*.log
          if-no-files-found: ignore
